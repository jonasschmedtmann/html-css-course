<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComponentName</title>

  <style>
    body {
      padding: 0px;
      margin: 0px;
      line-height: 1;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
    }

    table {
      margin-top: 100px;
      border-collapse: collapse;
      font-size: 24px;
      text-align: left;
      width: 825px;
    }



    thead tr {
      background-color: green;
      color: white;
    }

    tbody tr:nth-child(odd) {
      background-color: #f1f3f5;
    }

    tbody tr:nth-child(even) {
      background-color: #ced4da;
    }

    thead th {
      width: 25%;
    }

    td,
    th {
      padding: 10px 10px;
    }
  </style>

</head>

<body>
  <table>
    <thead>
      <tr>
        <th>Chair</th>
        <th>The laid back</th>
        <th>The worker bee</th>
        <th>The chair 2/4</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th>Width</th>
        <td>80cm</td>
        <td>80cm</td>
        <td>80cm</td>
      </tr>
      <tr>
        <th>Height</th>
        <td>80cm</td>
        <td>80cm</td>
        <td>80cm</td>
      </tr>
      <tr>
        <th>Depth</th>
        <td>80cm</td>
        <td>80cm</td>
        <td>80cm</td>
      </tr>
      <tr>
        <th>Weight</th>
        <td>80kg</td>
        <td>80kg</td>
        <td>80kg</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
